repos:
  # Core pre-commit hooks (whitespace, EOF, etc.)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  # Terraform formatting and basic validation
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.93.0
    hooks:
      - id: terraform_fmt
      - id: terraform_validate

  # Terraform security scanning with tfsec
  - repo: https://github.com/aquasecurity/tfsec
    rev: v1.28.1
    hooks:
      - id: tfsec
        args:
          - --soft-fail=false
        additional_dependencies: []

  # Terraform / IaC security scanning with Checkov (includes Databricks framework)
  - repo: https://github.com/bridgecrewio/checkov
    rev: 3.2.390
    hooks:
      - id: checkov
        args:
          - --framework=terraform
          - --framework=databricks
          - --quiet
        additional_dependencies: []

  # Custom Databricks security validation
  - repo: local
    hooks:
      - id: databricks-security-validation
        name: Databricks Security Validation
        entry: bash scripts/validate_databricks_security.sh
        language: system
        files: \.(tf|tfvars)$
        pass_filenames: false

